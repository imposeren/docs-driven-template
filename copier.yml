# Copier template settings and questions. See README.md and BASE-0006.
# Keep equal to COPIER_VERSION in scripts/check-sample-project.sh and to the version in README.md.
_min_copier_version: "9.19.1"
_subdirectory: template
_templates_suffix: .jinja
# Copier's default exclusions, then the optional files, left out unless their option is chosen.
_exclude:
  - copier.yaml
  - copier.yml
  - "~*"
  - "*.py[co]"
  - __pycache__
  - .git
  - .DS_Store
  - .svn
  - "{% if not uses_pyrefly %}/docs/architecture/decisions/PYRF-0001-pyrefly-language-server.md{% endif %}"
  - "{% if not has_language_servers %}/.claude/settings.json{% endif %}"
# Files a project owns once it exists: created from the template, never overwritten by a later copy or update,
# so they also never receive template changes (see README.md, "Update a project").
# The method's own docs (docs/meta, docs/agents) are not listed: they take template updates.
_skip_if_exists:
  - CLAUDE.md
  - README.md
  - compose.yaml
  - .pre-commit-config.yaml
  - docs/index.md
  - docs/behavior/index.md
  - docs/scenarios/index.md
  - docs/architecture/index.md
  - docs/ui/index.md
  - docs/guides/index.md
  - docs/reference/index.md
  - docs/reference/code/index.md
  - docs/reference/external/index.md
  - docs/reference/web-api/index.md
  - docs/roadmap.md
  - docs/architecture/components.md
  - docs/architecture/dev-environment.md
  - docs/architecture/quality-gate.md
  - docs/architecture/versioning.md
  - docs/architecture/decisions/index.md
  - docs/behavior/glossary.md
  - docs/architecture/glossary.md
  - docs/guides/contributor-setup.md

project_name:
  type: str
  help: Project name
  validator: "{% if not project_name.strip() %}Enter a name.{% endif %}"

project_description:
  type: str
  help: One or two sentences on what the project is and does, ending with a period
  validator: "{% if not project_description.strip() %}Enter a description.{% endif %}"

repo_url:
  type: str
  help: Web URL of the project's repository, such as https://github.com/example/project (optional)
  default: ""
  validator: >-
    {% if not repo_url %}{% elif not repo_url.startswith('https://') or ' ' in repo_url or '"' in repo_url %}Enter an https:// URL without spaces or quotes.{% elif repo_url.endswith('/') or repo_url.endswith('.git') %}Leave out the trailing "/" or ".git".{% endif %}

languages:
  type: str
  help: Languages the project's code is in (none is fine); Python and TypeScript/JavaScript get a language server for agents
  multiselect: true
  choices:
    Python: python
    TypeScript and JavaScript: typescript-javascript
    HTML and CSS: html-css
  default: "[]"

other_languages:
  type: str
  help: Other languages, comma-separated, such as "SQL, Bash" (only named in the docs; agents use grep for them)
  default: ""
  validator: >-
    {% set names = other_languages.lower().replace(' ', '').split(',') %}{% if '|' in other_languages %}Leave out "|".{% elif names | select('in', ['python', 'typescript', 'javascript', 'html', 'css']) | list %}Choose Python, TypeScript, JavaScript, HTML or CSS in the languages question instead.{% endif %}

python_language_server:
  type: str
  help: Language server agents use for Python
  when: "{{ 'python' in languages }}"
  choices:
    Anthropic's pyright-lsp (Pyright): official
    pyrefly-lsp, for projects that type-check with Pyrefly (PYRF-0001): pyrefly
  default: official

# Computed, not asked: whether any chosen language has a language-server plugin.
has_language_servers:
  type: bool
  when: false
  default: "{{ 'python' in languages or 'typescript-javascript' in languages }}"

# Computed, not asked: whether the project uses the Pyrefly option (PYRF-0001).
uses_pyrefly:
  type: bool
  when: false
  default: "{{ 'python' in languages and python_language_server == 'pyrefly' }}"

# Computed, not asked: the prefixes of all the template's ADRs; an option's prefix comes with that option.
template_adr_prefixes:
  type: yaml
  when: false
  default: "[BASE, PYRF]"

# Computed, not asked: the template ADR prefixes this project holds (BASE, plus those of its chosen options).
external_adr_prefixes:
  type: yaml
  when: false
  default: "{{ ['BASE'] + (['PYRF'] if uses_pyrefly else []) }}"

docspecsite_version:
  type: str
  help: docspecsite release (git tag) the project pins for its docs check and site build; the default is the one this template release was tested with
  # The release this template version needs and is checked with (scripts/check-sample-project.sh uses the default).
  default: v0.2.0
  validator: "{% if not docspecsite_version.strip() or ' ' in docspecsite_version %}Enter a tag such as v0.2.0, without spaces.{% endif %}"

adr_prefix:
  type: str
  help: >-
    Prefix of the project's own ADRs (architecture decision records: short docs recording one technical
    decision each, named <PREFIX>-NNNN). Capital letters only, such as APP; BASE is the template's own.
  validator: >-
    {% if not (adr_prefix.isascii() and adr_prefix.isalpha() and adr_prefix == adr_prefix.upper()) %}Use capital letters only, such as APP.{% elif adr_prefix in template_adr_prefixes %}{{ adr_prefix }} is a prefix of the template's ADRs; choose another.{% endif %}

spec_writer_model:
  type: str
  help: >-
    Model for the spec-writer agent, which writes the specs (e.g. opus); empty = the session's model.
    Specs decide more than any later step, so a capable model pays off here.
  default: ""

spec_writer_effort:
  type: str
  help: Reasoning effort for the spec-writer agent (low, medium, high); empty = the default effort.
  default: ""
  validator: "{% if spec_writer_effort and spec_writer_effort not in ['low', 'medium', 'high'] %}Use low, medium or high, or leave it empty.{% endif %}"
